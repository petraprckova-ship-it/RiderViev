name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout kód
      uses: actions/checkout@v4
      
    - name: Nastavení Pythonu ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip balíčky
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Instalace závislostí
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Lint s flake8
      run: |
        # Zastaví build pokud jsou Python syntax errors nebo undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero všechny errory jako warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Type checking s mypy
      run: |
        mypy src/ --ignore-missing-imports || true
        
    - name: Spuštění testů
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build dokumentace
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout kód
      uses: actions/checkout@v4
      
    - name: Nastavení Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalace Sphinx
      run: |
        pip install sphinx sphinx-rtd-theme
        
    - name: Build dokumentace
      run: |
        cd docs
        # TODO: sphinx-build -b html . _build
        echo "Dokumentace OK"
        
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kód
      uses: actions/checkout@v4
      
    - name: Nastavení Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalace tools
      run: |
        pip install black isort pylint
        
    - name: Black formatting check
      run: |
        black --check src/ tests/
        
    - name: isort import check
      run: |
        isort --check-only src/ tests/
        
    - name: Pylint
      run: |
        pylint src/ --exit-zero

  security:
    name: Security scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kód
      uses: actions/checkout@v4
      
    - name: Nastavení Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalace bandit
      run: |
        pip install bandit[toml]
        
    - name: Spuštění bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        
    - name: Upload report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.json
